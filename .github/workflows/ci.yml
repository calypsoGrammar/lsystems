name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run audit:baseline:check
      - run: npm run build
      - run: npm test
      - run: npm run audit
      - name: Browser check
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.55.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          npm run test:browser
